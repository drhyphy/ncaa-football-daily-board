name: NCAA football daily board

on:
  schedule:
    # 6:30 AM Eastern: 10:30 UTC during EDT, 11:30 UTC during EST. The gate
    # selects by the scheduled cron slot, so a delayed runner still executes.
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      run_label:
        description: Optional board label
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: ncaaf-daily-board
  cancel-in-progress: false

jobs:
  model-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out cloud model and ledger
        uses: actions/checkout@v4

      - name: Select the 6:30 AM Eastern run
        id: gate
        shell: bash
        run: |
          set +e
          python scripts/scheduled_run_gate.py \
            --event-name "${{ github.event_name }}" \
            --schedule "${{ github.event.schedule }}"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the DST duplicate; the other slot is 6:30 AM Eastern."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      - name: Install model
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install -e model pytest

      - name: Refresh every NCAA moneyline and score the board
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: model
        run: python -m ncaaf_model.cli run-daily

      - name: Validate and publish the daily board
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pytest -q model/tests tests
          python scripts/site_board.py

      - name: Persist the append-only timing ledger
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/ledger model/reports site-data/boards.json
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Daily NCAA football board $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
