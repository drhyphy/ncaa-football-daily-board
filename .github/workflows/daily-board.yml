name: NCAA football daily board

on:
  schedule:
    # One of these is 9:07 AM Eastern across daylight/standard time. The gate
    # below skips the other, keeping the capture time consistent year-round.
    - cron: "7 13,14 * * *"
  workflow_dispatch:
    inputs:
      run_label:
        description: Optional board label
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: ncaaf-daily-board
  cancel-in-progress: false

jobs:
  model-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out cloud model and ledger
        uses: actions/checkout@v4

      - name: Select the 9 AM Eastern run
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +%H)" != "09" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC slot outside 9 AM Eastern."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      - name: Install model
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install -e model pytest

      - name: Refresh every NCAA moneyline and score the board
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: model
        run: python -m ncaaf_model.cli run-daily

      - name: Validate and publish the daily board
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pytest -q model/tests tests
          python scripts/site_board.py

      - name: Persist the append-only timing ledger
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/ledger model/reports site-data/boards.json
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Daily NCAA football board $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
