[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncaaf-market-research"
version = "0.2.0"
description = "Point-in-time NCAA football totals and moneyline paper-research workflow"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "requests",
  "scikit-learn",
  "scipy",
  "PyYAML",
]

[project.scripts]
ncaaf-model = "ncaaf_model.cli:main"

[tool.setuptools.packages.find]
include = ["ncaaf_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
